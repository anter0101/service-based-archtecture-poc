services:
  gateway:
    build:
      context: .
      dockerfile: docker/gateway.Dockerfile
      target: production
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      NODE_ENV: production
      APP: gateway
      GATEWAY_PORT: 8080
      IDENTITY_URL: http://identity-service:8081
      APP_SECRET_KEY: ${APP_SECRET_KEY:-change-me}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
    depends_on:
      identity-service:
        condition: service_started
    restart: unless-stopped

  identity-service:
    build:
      context: .
      dockerfile: docker/identity.Dockerfile
      target: production
    ports:
      - "${IDENTITY_PORT:-8081}:8081"
    environment:
      NODE_ENV: production
      APP: identity-service
      IDENTITY_PORT: 8081
      APP_SECRET_KEY: ${APP_SECRET_KEY:-change-me}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      DATABASE_NAME: ${POSTGRES_DB:-template_backend}
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${POSTGRES_USER:-postgres}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DATABASE_SSL: false
      DATABASE_LOGGING: false
      DATABASE_SYNCHRONIZE: false
      DATABASE_MIGRATIONS_RUN: true
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-template_backend}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - gateway
    restart: unless-stopped

volumes:
  postgres_data:
